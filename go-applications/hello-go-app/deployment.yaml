apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-go-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-go-app
  template:
    metadata:
      labels:
        app: hello-go-app
    spec:
      containers:
      - name: hello-go-app
        image: <image-name>:<tag>
        ports:
        - containerPort: 8080
